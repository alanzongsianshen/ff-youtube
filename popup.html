<!doctype html>
<meta charset="utf-8">
<title>Hush Skip</title>
<style>
  :root {
    color-scheme: light dark;
    --red: #e0262d; --red-dark: #c8161d;
    --bg: #fff; --card: #f5f5f7; --line: #e3e3e8; --text: #1d1d1f; --muted: #6e6e73;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --text: #f5f5f7; --muted: #a1a1a6; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
         font: 13px/1.4 system-ui, sans-serif; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 32px; height: 32px; }
  header b { display: block; font-size: 15px; }
  header small, .muted { color: var(--muted); }

  .status { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--card); }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  [data-state="live"] .dot { background: #34c759; box-shadow: 0 0 0 3px #34c75933; }
  [data-state="busy"] .dot { background: #ff9f0a; }
  [data-state="error"] .dot { background: var(--red); }

  section { display: grid; gap: 8px; }
  h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row > :first-child { flex: 1; min-width: 0; }
  .row > label { white-space: nowrap; }

  button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button:hover:not(:disabled) { filter: brightness(.95); }
  button:disabled { cursor: default; opacity: .6; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { background: var(--red-dark); }
  input[type="number"] { width: 4.5em; font: inherit; padding: 4px 6px; border-radius: 6px;
                         border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type="range"] { width: 100%; accent-color: var(--red); }

  #voices { display: grid; gap: 6px; }
  .voice { display: grid; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 2px solid transparent; }
  .voice.picked { border-color: var(--red); }
  .voice audio { width: 100%; height: 28px; }
  .voice button { padding: 5px 10px; font-size: 12px; }
  .voice.picked button { background: var(--red); border-color: var(--red); color: #fff; opacity: 1; }

  footer { font-size: 11px; color: var(--muted); }
</style>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><b data-i18n="extName"></b><small><span data-i18n="skipping"></span> <span id="voice"></span></small></div>
  </header>

  <div class="status" id="statusbox"><span class="dot"></span><span id="status"></span></div>

  <section>
    <h2 data-i18n="enrollHeading"></h2>
    <div class="row">
      <button id="enroll" data-i18n="enrollBtn"></button>
      <label class="muted"><input id="sec" type="number" value="20" min="5" max="120"> <span data-i18n="sec"></span></label>
    </div>
    <div id="voices"></div>
  </section>

  <section>
    <h2 data-i18n="skipHeading"></h2>
    <label class="row"><span data-i18n="threshold"></span><b id="thrv"></b></label>
    <input id="thr" type="range" min="0.5" max="0.99" step="0.01">
    <div class="row">
      <button id="start" class="primary" data-i18n="start"></button>
      <button id="stop" data-i18n="stop"></button>
    </div>
  </section>

  <footer data-i18n="footer"></footer>
  <script type="module" src="popup.js"></script>
</body>
